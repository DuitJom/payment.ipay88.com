<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Akaun - DuitJom</title>

    <meta name="description" content="Cipta akaun DuitJom untuk menguruskan pembayaran pinjaman anda dengan lebih mudah dan selamat.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2563eb">

    <link rel="icon" type="image/png" sizes="96x96" href="../images2/favicon-96x96.png">
    <link rel="shortcut icon" href="../images2/favicon.ico">

    <link rel="preconnect" href="https://challenges.cloudflare.com">

    <!-- Auth sub-page styles (same design language as auth/login.css) -->
    <link rel="stylesheet" href="../auth/auth-page.css">

    <script src="../auth/otp-turnstile.js?v=20261003-otp-flow"></script>
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <link rel="stylesheet" href="../auth/email-otp.css?v=20261003-otp-flow">
    <script src="../i18n/translations.js?v=20261003-otp-flow"></script>
    <script src="../i18n/i18n.js?v=20261003-otp-flow"></script>
    <script type="module" src="../auth/app-auth.js?v=20261003-otp-flow"></script>
</head>

<body class="auth-page">

    <!-- Decorative background only -->
    <div class="auth-backdrop" aria-hidden="true">
        <span class="auth-orb auth-orb-one"></span>
        <span class="auth-orb auth-orb-two"></span>
        <span class="auth-orb auth-orb-three"></span>
    </div>

    <header class="auth-brand">
        <a class="auth-brand-link" href="../index.html" aria-label="Kembali ke halaman utama DuitJom">
            <!-- One logo only: the image when it loads, the wordmark as fallback. -->
            <img class="auth-brand-logo" src="../IMG_6715.png" alt="Logo DuitJom" width="120" height="32"
                 onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
            <span class="auth-brand-name" hidden>Duit<span>Jom</span></span>
        </a>
    </header>

    <main class="auth-shell" data-email-auth>
        <div class="auth-locale">
            <label for="authLocale" data-i18n="lang.switcherLabel">Bahasa</label>
            <select id="authLocale" data-auth-locale>
                <option value="ms">Bahasa Malaysia</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>
        <article id="authLoginPanel" class="auth-card" aria-labelledby="registerTitle">
            <p class="auth-kicker" data-i18n="auth.kickerRegister">AKAUN BARU</p>
            <h1 id="registerTitle" class="auth-title" data-i18n="auth.registerTitle">Daftar Akaun</h1>
            <p class="auth-subtitle" data-i18n="auth.otpSubtitle">Sahkan email anda menggunakan kod OTP 6 digit. Tiada kata laluan diperlukan.</p>
            <form id="emailLoginForm" class="auth-form">
                <div class="auth-field">
                    <label class="auth-label" for="emailInput" data-i18n="auth.email">Email</label>
                    <input class="auth-input" id="emailInput" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required>
                </div>
                <fieldset class="login-otp-fieldset">
                    <legend data-i18n="auth.otpLabel">Kod Pengesahan (OTP)</legend>
                    <div class="login-otp-digits">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 1" autocomplete="one-time-code">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 2" autocomplete="off">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 3" autocomplete="off">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 4" autocomplete="off">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 5" autocomplete="off">
                            <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="6" data-login-otp aria-label="Digit OTP 6" autocomplete="off">
                    </div>
                </fieldset>
                <div class="login-otp-resend">
                    <button id="resendOtpButton" type="button">Hantar Semula OTP</button>
                </div>
                <div class="auth-turnstile">
                    <div id="loginTurnstileWidget" class="cf-turnstile"
                        data-sitekey="0x4AAAAAAFDZ5bKGW2izQzbZ" data-action="auth"
                        data-theme="auto" data-size="flexible"
                        data-callback="onLoginTurnstileSuccess"
                        data-error-callback="onLoginTurnstileError"
                        data-expired-callback="onLoginTurnstileExpired"></div>
                </div>
                <button id="emailLoginButton" class="auth-primary" type="submit" data-i18n="auth.requestOtp" disabled>Hantar Kod OTP</button>
                <button id="verifyOtpButton" class="auth-primary" type="button" data-i18n="auth.verifyOtp" disabled>Sahkan OTP &amp; Log Masuk</button>
            </form>
            <nav class="auth-switch-links" aria-label="Pautan log masuk">
                <a class="auth-link" href="../index.html?auth=email" data-i18n="auth.backToLogin">Kembali ke Log Masuk</a>
            </nav>
        </article>
        <article id="authUserPanel" class="auth-card hidden" hidden>
            <p class="auth-kicker" data-i18n="auth.kickerAccount">AKAUN ANDA</p>
            <h2 id="userDisplay" class="auth-title" aria-live="polite"></h2>
            <p class="auth-subtitle" data-i18n="auth.loggedInSubtitle">Email anda telah disahkan. Teruskan untuk mengisi maklumat pelanggan.</p>
            <div id="btnPembayaranPinjaman" hidden>
                <a id="authContinueButton" class="auth-primary" href="../index.html?step=payment" data-i18n="auth.continueButton">Teruskan</a>
            </div>
            <button id="logoutButton" class="auth-secondary" type="button" data-i18n="auth.logoutButton">Log Keluar</button>
        </article>
        <p id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></p>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 DuitJom. Semua hak terpelihara.</p>
    </footer>

</body>
</html>
