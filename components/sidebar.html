<!-- FIREBASE AUTHENTICATION SCRIPT (Google & Email/Password) -->
<!-- ====================================================== -->
<script type="module">
    // 1. Import fungsi Firebase 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
    import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        onAuthStateChanged, 
        signOut,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    // 2. FIREBASE CONFIG ANDA
    const firebaseConfig = {
        apiKey: "AIzaSyCKb-QOYSTP0scv0UXmraluMe3xFtfIH_0",
        authDomain: "duitjom-sign-up-in.firebaseapp.com",
        projectId: "duitjom-sign-up-in",
        storageBucket: "duitjom-sign-up-in.firebasestorage.app",
        messagingSenderId: "246834525616",
        appId: "1:246834525616:web:a8429bda0166e6e03c1275",
        measurementId: "G-T52Q57SJC4"
    };

    // 3. Initialize Firebase, Analytics & Auth
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elements
    const googleSection = document.getElementById('sidebarGoogleSection');
    const accountSection = document.getElementById('sidebarAccountSection');
    const userNameElement = document.querySelector('[data-auth-user-name]');
    const authMessage = document.getElementById('sidebarAuthMessage');
    const spinner = document.getElementById('loginSpinnerOverlay');

    // 4. Pantau Status Log Masuk Pengguna
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Jika sudah login
            if(googleSection) googleSection.classList.add('hidden');
            if(accountSection) accountSection.classList.remove('hidden');
            if(userNameElement) userNameElement.textContent = user.displayName || user.email;
        } else {
            // Jika belum login / sudah log keluar
            if(googleSection) googleSection.classList.remove('hidden');
            if(accountSection) accountSection.classList.add('hidden');
            if(userNameElement) userNameElement.textContent = '';
        }
    });

    // 5. Fungsi Log Masuk Google
    window.signInWithGoogle = async (e) => {
        e.preventDefault();
        if(authMessage) authMessage.textContent = ""; 
        
        try {
            if(spinner) spinner.classList.remove('hidden');
            await signInWithPopup(auth, googleProvider);
            setTimeout(() => { if(spinner) spinner.classList.add('hidden'); }, 1000);
        } catch (error) {
            console.error("Ralat Log Masuk Google:", error);
            if(spinner) spinner.classList.add('hidden');
            if(authMessage) authMessage.textContent = "Log masuk dibatalkan atau ralat berlaku.";
        }
    };

    // 6. Fungsi Log Keluar
    window.logoutUser = async () => {
        try {
            await signOut(auth);
        } catch (error) {
            console.error("Ralat Log Keluar:", error);
        }
    };

    // 7. Fungsi Daftar Akaun Baru (Sign Up Email & Password)
    window.signUpWithEmail = async () => {
        const email = document.getElementById('userEmail').value;
        const password = document.getElementById('userPassword').value;
        if(authMessage) authMessage.textContent = "";

        if(password.length < 6) {
            alert("Kata laluan mesti melebihi 6 aksara.");
            return;
        }

        try {
            if(spinner) spinner.classList.remove('hidden');
            await createUserWithEmailAndPassword(auth, email, password);
            setTimeout(() => { if(spinner) spinner.classList.add('hidden'); }, 1000);
        } catch (error) {
            console.error("Ralat Daftar:", error);
            if(spinner) spinner.classList.add('hidden');
            
            if(error.code === 'auth/email-already-in-use') {
                if(authMessage) authMessage.textContent = "Email ini telah didaftarkan. Sila log masuk.";
            } else {
                if(authMessage) authMessage.textContent = "Gagal mendaftar. Pastikan format email betul.";
            }
        }
    };

    // 8. Fungsi Log Masuk Email/Password (Sign In)
    window.loginWithEmail = async () => {
        const email = document.getElementById('userEmail').value;
        const password = document.getElementById('userPassword').value;
        if(authMessage) authMessage.textContent = "";

        try {
            if(spinner) spinner.classList.remove('hidden');
            await signInWithEmailAndPassword(auth, email, password);
            setTimeout(() => { if(spinner) spinner.classList.add('hidden'); }, 1000);
        } catch (error) {
            console.error("Ralat Log Masuk:", error);
            if(spinner) spinner.classList.add('hidden');
            if(authMessage) authMessage.textContent = "Email atau kata laluan salah.";
        }
    };
</script>
