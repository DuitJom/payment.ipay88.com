<!-- FIREBASE AUTHENTICATION SCRIPT (Google, OTP & Analytics) -->
<!-- ====================================================== -->
<script type="module">
    // 1. Import fungsi Firebase (Menggunakan versi 12.18.0)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
    import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    // 2. FIREBASE CONFIG ANDA
    const firebaseConfig = {
        apiKey: "AIzaSyCKb-QOYSTP0scv0UXmraluMe3xFtfIH_0",
        authDomain: "duitjom-sign-up-in.firebaseapp.com",
        projectId: "duitjom-sign-up-in",
        storageBucket: "duitjom-sign-up-in.firebasestorage.app",
        messagingSenderId: "246834525616",
        appId: "1:246834525616:web:43af7e37f9a14d1d3c1275",
        measurementId: "G-8MFF6QP391"
    };

    // 3. Initialize Firebase, Analytics & Auth
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elements
    const googleSection = document.getElementById('sidebarGoogleSection');
    const accountSection = document.getElementById('sidebarAccountSection');
    const userNameElement = document.querySelector('[data-auth-user-name]');
    const authMessage = document.getElementById('sidebarAuthMessage');
    const spinner = document.getElementById('loginSpinnerOverlay');

    // 4. Pantau Status Log Masuk Pengguna
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Jika sudah login, sembunyikan borang login, tunjuk akaun aktif
            googleSection.classList.add('hidden');
            accountSection.classList.remove('hidden');
            userNameElement.textContent = user.displayName || user.email;
        } else {
            // Jika belum login / sudah log keluar
            googleSection.classList.remove('hidden');
            accountSection.classList.add('hidden');
            userNameElement.textContent = '';
        }
    });

    // 5. Fungsi Log Masuk Google
    window.signInWithGoogle = async (e) => {
        e.preventDefault();
        authMessage.textContent = ""; 
        
        try {
            if(spinner) spinner.classList.remove('hidden');
            
            await signInWithPopup(auth, googleProvider);
            
            setTimeout(() => {
                if(spinner) spinner.classList.add('hidden');
            }, 1000);

        } catch (error) {
            console.error("Ralat Log Masuk Google:", error);
            if(spinner) spinner.classList.add('hidden');
            authMessage.textContent = "Log masuk dibatalkan atau ralat berlaku.";
        }
    };

    // 6. Fungsi Log Keluar
    window.logoutUser = async () => {
        try {
            await signOut(auth);
        } catch (error) {
            console.error("Ralat Log Keluar:", error);
        }
    };

    // 7. Dummy Function untuk Email OTP
    window.sendEmailOTP = () => {
        const email = document.getElementById('otpEmail').value;
        if(email) {
            document.getElementById('otpVerificationSection').classList.remove('hidden');
            alert('Fungsi OTP perlu disambung ke Firebase Cloud Functions atau SendGrid.');
        } else {
            alert('Sila masukkan email.');
        }
    };

    window.verifyEmailOTP = () => {
        const code = document.getElementById('otpCode').value;
        alert(`Mengesahkan kod: ${code}`);
    };
</script>
