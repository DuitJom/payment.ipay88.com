<!-- Sidebar login is controlled by the main auth module in index.html. -->
<div id="sidebarGoogleSection" class="px-1 py-2">
    <form id="sidebarEmailLoginForm" class="login-panel space-y-3">
        <div>
            <label for="userEmail" class="sr-only" data-i18n="sidebar.emailPlaceholder">Enter your email</label>
            <input
                type="email"
                id="userEmail"
                autocomplete="email"
                data-i18n-placeholder="sidebar.emailPlaceholder"
                placeholder="Enter your email"
                required>
        </div>

        <div>
            <label for="userPassword" class="sr-only" data-i18n="sidebar.passwordPlaceholder">Enter your password</label>
            <input
                type="password"
                id="userPassword"
                autocomplete="current-password"
                data-i18n-placeholder="sidebar.passwordPlaceholder"
                placeholder="Enter your password"
                required>
        </div>

        <p id="sidebarAuthMessage" class="login-message text-red-600" role="status" aria-live="polite"></p>

        <button type="submit" id="sidebarEmailLoginButton" class="login-primary-button" data-i18n="sidebar.loginButton">
            Log In
        </button>
    </form>

    <div class="login-divider"><span data-i18n="auth.or">or</span></div>

    <button
        type="button"
        id="sidebarGoogleLoginButton"
        class="login-provider-button"
        onclick="window.signInWithGoogle?.(event)">
        <svg class="google-provider-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.44H12v4.62h6.48a5.54 5.54 0 0 1-2.4 3.63v3.02h3.88c2.27-2.09 3.56-5.17 3.56-8.83Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.96-2.9l-3.88-3.02c-1.08.73-2.47 1.16-4.08 1.16-3.14 0-5.8-2.12-6.75-4.96H1.24v3.11A11.99 11.99 0 0 0 12 24Z"/>
            <path fill="#FBBC05" d="M5.25 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.24a11.99 11.99 0 0 0 0 10.78l4.01-3.11Z"/>
            <path fill="#EA4335" d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.44-3.44A11.94 11.94 0 0 0 12 0 11.99 11.99 0 0 0 1.24 6.61l4.01 3.11C6.2 6.88 8.86 4.76 12 4.76Z"/>
        </svg>
        <span data-i18n="sidebar.googleButton">Sign in with Google</span>
    </button>
</div>

<div id="sidebarAccountSection" class="hidden px-1 py-2">
    <div class="login-card">
        <p class="text-sm text-slate-600">
            <span data-i18n="sidebar.welcomeBack">Welcome back,</span>
            <span data-auth-user-name class="font-bold text-slate-900"></span>
        </p>

        <button type="button" class="login-secondary-button mt-3 w-full" data-i18n="sidebar.logoutButton" onclick="window.logoutUser?.(event)">
            Log Out
        </button>
    </div>
</div>

<div id="loginSpinnerOverlay" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-white/70 backdrop-blur-sm">
    <span class="text-sm font-semibold text-slate-600" data-i18n="sidebar.pleaseWait">Please wait...</span>
</div>
