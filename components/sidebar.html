<!-- Login sidebar dikawal oleh modul auth utama dalam index.html. -->
<div id="sidebarGoogleSection">
    <form id="sidebarEmailLoginForm">
        <input
            type="email"
            id="userEmail"
            autocomplete="email"
            placeholder="Masukkan Email"
            required>

        <input
            type="password"
            id="userPassword"
            autocomplete="current-password"
            placeholder="Masukkan Kata Laluan"
            required>

        <p id="sidebarAuthMessage" style="color:red;" role="status" aria-live="polite"></p>

        <button type="submit" id="sidebarEmailLoginButton">
            Log Masuk
        </button>
    </form>

    <button
        type="button"
        id="sidebarGoogleLoginButton"
        onclick="window.signInWithGoogle?.(event)">
        Log Masuk Google
    </button>
</div>

<div id="sidebarAccountSection" class="hidden">
    <p>
        Selamat kembali,
        <span data-auth-user-name></span>
    </p>

    <button type="button" onclick="window.logoutUser?.(event)">
        Log Keluar
    </button>
</div>

<div id="loginSpinnerOverlay" class="hidden">
    Sila tunggu...
</div>
