<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuitJom - Log Masuk</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div id="auth-login-container" style="text-align: center; margin-top: 50px;">
    <h2>Log Masuk ke DuitJom</h2>
    
    <!-- Butang Google menggunakan handler dari auth-ui.js -->
    <button 
      type="button" 
      data-google-sign-in 
      onclick="window.signInWithGoogle(event)" 
      style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
      Log Masuk dengan Google
    </button>
  </div>

  <!-- Bekas reCAPTCHA untuk Phone OTP -->
  <div id="recaptcha-container"></div>

  <!-- Panggil fail JS di bahagian bawah body secara bersiri -->
  <script type="module" src="firebase-config.js"></script>
  <script src="auth-ui.js"></script>
  <script src="email-magic-link.js"></script>
  <script src="phone-otp.js"></script>
  <script src="totp.js"></script>

</body>
</html>
