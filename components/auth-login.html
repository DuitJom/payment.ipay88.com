<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuitJom - Log Masuk</title>
  <link rel="stylesheet" href="login.css">
  <!-- Tambah Font Awesome untuk ikon (jika diperlukan) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- ===== BANNER BAHAGIAN ATAS ===== -->
  <div class="auth-banner">
    <h1>Selamat Datang ke DuitJom</h1>
    <p>Cara paling selamat dan mudah untuk urus kewangan anda.</p>
    <img
      src="https://via.placeholder.com/600x200/e5e7eb/1d4ed8?text=Fintech+Banner+Image"
      alt="Banner DuitJom"
      class="banner-image"
    >
  </div>

  <!-- ===== PANEL LOG MASUK (DIPINDAHKAN KE BAWAH) ===== -->
  <div id="auth-login-container">
    <!-- Butang Google Sign-In (boleh kekal di atas atau dipindahkan ke bawah) -->
    <button class="login-provider-button" id="google-login-button">
      <i class="fab fa-google"></i> Log Masuk dengan Google
    </button>

    <!-- Tab Kaedah Log Masuk (Email/Phone/TOTP) -->
    <div class="login-methods">
      <button class="login-method active" data-method="email">E-mel</button>
      <button class="login-method" data-method="phone">Telefon</button>
      <button class="login-method" data-method="totp">TOTP</button>
    </div>

    <!-- Panel E-mel (aktif secara lalai) -->
    <div id="email-panel" class="login-panel">
      <input type="email" placeholder="Alamat e-mel" class="login-input">
      <button class="login-button">Log Masuk dengan E-mel</button>
      <a href="#" class="magic-link">Hantar Pautan Ajaib</a>
    </div>

    <!-- Panel Telefon (tersembunyi secara lalai) -->
    <div id="phone-panel" class="login-panel hidden">
      <input type="tel" placeholder="Nombor telefon" class="login-input">
      <button class="login-button">Hantar Kod OTP</button>
    </div>

    <!-- Panel TOTP (tersembunyi secara lalai) -->
    <div id="totp-panel" class="login-panel hidden">
      <input type="text" placeholder="Kod TOTP" class="login-input">
      <button class="login-button">Sahkan Kod</button>
    </div>
  </div>

  <!-- Script untuk toggle tab kaedah log masuk -->
  <script>
    document.querySelectorAll('.login-method').forEach(button => {
      button.addEventListener('click', () => {
        // Alihkan kelas 'active' pada tab
        document.querySelectorAll('.login-method').forEach(btn => {
          btn.classList.remove('active');
        });
        button.classList.add('active');

        // Sembunyikan semua panel, kemudian tunjukkan panel yang dipilih
        document.querySelectorAll('.login-panel').forEach(panel => {
          panel.classList.add('hidden');
        });
        document.getElementById(button.dataset.method + '-panel').classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
